name: Publish Marimo Notebooks to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'marimo/**'
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install marimo \
            pandas numpy scipy statsmodels \
            matplotlib seaborn plotly \
            geopandas pycountry

      - name: Export marimo notebooks to HTML
        run: |
          mkdir -p docs/site
          for notebook in marimo/*.py; do
            [ -f "$notebook" ] || continue
            name=$(basename "$notebook" .py)
            echo "Exporting $notebook → docs/site/${name}.html"
            marimo export html "$notebook" -o "docs/site/${name}.html"
          done

      - name: Generate index page
        run: |
          cat > docs/site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Grounds for Correlation</title>
            <style>
              body { font-family: Georgia, serif; max-width: 680px; margin: 80px auto; padding: 0 24px; color: #222; }
              h1 { font-size: 1.8em; margin-bottom: 0.2em; }
              .subtitle { color: #555; font-style: italic; margin-bottom: 2em; }
              a { display: block; margin: 14px 0; font-size: 1.05em; color: #1a5276; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Grounds for Correlation</h1>
            <p class="subtitle">Climate, population, and oil price as predictors of coffee production and export revenue</p>
          EOF

          for html in docs/site/*.html; do
            name=$(basename "$html" .html)
            if [ "$name" != "index" ]; then
              label=$(echo "$name" | tr '_-' '  ' | sed 's/\b./\u&/g')
              echo "  <a href=\"${name}.html\">→ ${label}</a>" >> docs/site/index.html
            fi
          done

          echo "</body></html>" >> docs/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
